<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba NPC</title><style>body{margin:0;background:#ddd;font:16px system-ui}header{position:absolute;z-index:2;background:white;padding:12px}canvas{display:block}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><header><select id="model"><option>Male_Casual.glb</option><option>Male_Suit.glb</option><option>Male_Shirt.glb</option><option>Male_LongSleeve.glb</option><option>Female_TankTop.glb</option><option>Female_Dress.glb</option><option>Female_Casual.glb</option><option>Female_Alternative.glb</option></select> <button id="walk">Animar</button> <button id="raw">Geometría sin esqueleto</button> <span id="status">Cargando</span></header><script type="module">import * as T from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const scene=new T.Scene();scene.background=new T.Color(0xdedede);const camera=new T.PerspectiveCamera(40,innerWidth/innerHeight,.001,10000);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x777777,2));const light=new T.DirectionalLight(0xffffff,3);light.position.set(3,5,4);scene.add(light);let model,mixer,raw,clips=[],serial=0;const clock=new T.Clock();const status=document.getElementById('status'),select=document.getElementById('model');async function load(){const id=++serial;status.textContent='Cargando';try{const g=await new GLTFLoader().loadAsync('./'+select.value);if(id!==serial)return;if(model)scene.remove(model);if(raw){scene.remove(raw);raw=null;}mixer=null;model=g.scene;clips=g.animations;scene.add(model);model.updateMatrixWorld(true);const box=new T.Box3().setFromObject(model,true),size=box.getSize(new T.Vector3()),center=box.getCenter(new T.Vector3()),d=Math.max(size.x,size.y,size.z);controls.target.copy(center);camera.position.copy(center).add(new T.Vector3(0,0,d*2.8));camera.near=Math.max(d/10000,.000001);camera.far=d*100;camera.updateProjectionMatrix();controls.update();status.textContent='Cargado · dimensiones '+size.toArray().map(x=>x.toFixed(3)).join(' × ')+' · '+clips.length+' animaciones';}catch(e){status.textContent=e.message}}select.onchange=load;document.getElementById('raw').onclick=()=>{if(!model)return;if(raw){scene.remove(raw);raw=null;model.visible=true;return;}raw=new T.Group();model.updateMatrixWorld(true);model.traverse(o=>{if(!o.isMesh)return;const m=new T.Mesh(o.geometry,o.material);m.matrix.copy(o.matrixWorld);m.matrixAutoUpdate=false;m.frustumCulled=false;raw.add(m);});scene.add(raw);model.visible=false;};document.getElementById('walk').onclick=()=>{if(!model)return;if(mixer){mixer.stopAllAction();mixer=null;return}const clip=clips.find(c=>/walk/i.test(c.name));if(clip){mixer=new T.AnimationMixer(model);mixer.clipAction(clip).play()}};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{const dt=clock.getDelta();if(mixer)mixer.update(dt);renderer.render(scene,camera)});load();</script></html>
