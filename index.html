<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Huellas del Patrimonio</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9e2d4;color:#552a36;font:16px system-ui}canvas{display:block}header{position:absolute;top:16px;left:16px;background:#fff9ed;padding:16px;border-radius:12px;max-width:calc(100% - 32px);box-shadow:0 4px 24px #0002}h1{font: bold 25px Georgia;margin:0 0 6px}p{margin:6px 0}button,label{background:#632c3c;color:white;border:0;border-radius:8px;padding:12px;cursor:pointer;font:inherit}#status{font-size:13px}#hint{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:#fff9ed;padding:12px;border-radius:8px;text-align:center}#pad{position:absolute;bottom:20px;left:20px;display:grid;grid-template-columns:repeat(3,44px);gap:4px}#pad button{touch-action:none;padding:8px}dialog{background:#fff9ed;color:#552a36;border:1px solid #b49b84;border-radius:12px;max-width:90vw;width:420px;padding:28px}dialog::backdrop{background:#0007}input{display:none}#explore{position:absolute;bottom:20px;right:20px}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><header><h1>Huellas del Patrimonio</h1><p>Centro de Bogotá · Prototipo 01</p><p id="count">Descubrimientos: 0 / 10</p><p id="status">Cargando escenario…</p><label>Elegir bogota.glb<input id="file" type="file" accept=".glb"></label></header><div id="hint">WASD / flechas · E para explorar</div><div id="pad"><span></span><button data-key="w">↑</button><span></span><button data-key="a">←</button><button data-key="s">↓</button><button data-key="d">→</button></div><button id="explore">Explorar</button><dialog id="book"><h1 id="title"></h1><p>Cuaderno patrimonial</p><p>Ficha provisional. Próximamente: historia, fotografías y diagnóstico de conservación.</p><button id="close">Volver al recorrido</button></dialog><script type="module">
import * as T from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const $=id=>document.getElementById(id),scene=new T.Scene();scene.background=new T.Color(0xe9e2d4);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.prepend(renderer.domElement);const camera=new T.OrthographicCamera();const offset=new T.Vector3(1,1.25,1);scene.add(new T.HemisphereLight(0xffffff,0x8b8074,2.4));const sun=new T.DirectionalLight(0xfff0dc,2);sun.position.set(100,200,70);scene.add(sun);
let span=65,speed=12,radius=.65,ground=0,model,sites=[],obstacles=[],bounds,ready=false,nearest;const player=new T.Group();const body=new T.Mesh(new T.CapsuleGeometry(.65,1.1,4,8),new T.MeshStandardMaterial({color:0x702e42}));body.position.y=1.25;player.add(body);const head=new T.Mesh(new T.SphereGeometry(.48,12,8),new T.MeshStandardMaterial({color:0xe8bc91}));head.position.y=2.55;player.add(head);scene.add(player);player.visible=false;
const keys=new Set(),seen=new Set();function resize(){const a=innerWidth/innerHeight;camera.left=-span*a/2;camera.right=span*a/2;camera.top=span/2;camera.bottom=-span/2;camera.near=.1;camera.far=10000;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);resize();
function blocked(x,z){return obstacles.some(b=>x>b.min.x-radius&&x<b.max.x+radius&&z>b.min.z-radius&&z<b.max.z+radius)}
function openSite(s){if(!s)return;seen.add(s.id);$('count').textContent='Descubrimientos: '+seen.size+' / '+sites.length;$('title').textContent='Buzón '+s.id;keys.clear();$('book').showModal()}
$('close').onclick=()=>$('book').close();$('explore').onclick=()=>openSite(nearest);addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==='e'&&!$('book').open)openSite(nearest);keys.add(e.key.toLowerCase())});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);keys.add(b.dataset.key)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys.delete(b.dataset.key)});
const loader=new GLTFLoader();function load(url){$('status').textContent='Cargando modelo…';loader.load(url,g=>{if(model)scene.remove(model);model=g.scene;scene.add(model);model.updateMatrixWorld(true);const groups=new Map();let roads;model.traverse(o=>{if(!o.isMesh)return;const m=o.name.match(/PATRIMONIO_(\d+)/i);const b=new T.Box3().setFromObject(o);if(m){if(!groups.has(m[1]))groups.set(m[1],new T.Box3());groups.get(m[1]).union(b);o.userData.site=m[1]}else if(/CALZADAS/i.test(o.name))roads=b;});sites=[...groups].map(([id,b])=>({id,b,c:b.getCenter(new T.Vector3())}));if(!sites.length){$('status').textContent='No se identificaron edificios';return}bounds=new T.Box3();sites.forEach(s=>bounds.union(s.b));ground=roads?roads.max.y:bounds.min.y;const size=bounds.getSize(new T.Vector3());span=Math.max(35,Math.min(size.x+size.z,100));speed=span*.22;radius=span*.009;player.scale.setScalar(span/65);obstacles=sites.map(s=>s.b);const c=bounds.getCenter(new T.Vector3());bounds.expandByScalar(span*.25);let spawn=null;for(let r=0;r<span*2&&!spawn;r+=radius*2){for(let i=0;i<32;i++){const x=c.x+r*Math.cos(i*Math.PI/16),z=c.z+r*Math.sin(i*Math.PI/16);if(!blocked(x,z)&&bounds.containsPoint(new T.Vector3(x,c.y,z))){spawn=new T.Vector3(x,ground,z);break}}}player.position.copy(spawn||new T.Vector3(c.x,ground,c.z));player.visible=true;ready=true;resize();$('status').textContent=sites.length+' edificios · Escenario cargado';},undefined,()=>{$('status').textContent='Falta el modelo: selecciona bogota.glb';});}
$('file').onchange=e=>{if(e.target.files[0])load(URL.createObjectURL(e.target.files[0]))};load('./bogota.glb');
const ray=new T.Raycaster();renderer.domElement.onclick=e=>{if(!ready)return;ray.setFromCamera(new T.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1),camera);const hit=ray.intersectObject(model,true).find(h=>h.object.userData.site);if(hit)openSite(sites.find(s=>s.id===hit.object.userData.site))};
const clock=new T.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);if(ready){let x=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft')),z=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));const v=new T.Vector3(x,0,z).applyAxisAngle(new T.Vector3(0,1,0),Math.PI/4);if(v.length()&&!$('book').open){v.normalize().multiplyScalar(speed*dt);const p=player.position;let nx=T.MathUtils.clamp(p.x+v.x,bounds.min.x,bounds.max.x),nz=T.MathUtils.clamp(p.z+v.z,bounds.min.z,bounds.max.z);if(!blocked(nx,p.z))p.x=nx;if(!blocked(p.x,nz))p.z=nz}let dist=Infinity;nearest=null;for(const s of sites){const p=player.position,b=s.b;const d=Math.hypot(p.x-T.MathUtils.clamp(p.x,b.min.x,b.max.x),p.z-T.MathUtils.clamp(p.z,b.min.z,b.max.z));if(d<dist&&d<span*.12){dist=d;nearest=s}}$('hint').textContent=nearest?'E · Explorar buzón '+nearest.id:'WASD / flechas · Explora los edificios';const target=player.position.clone();camera.position.copy(target).addScaledVector(offset,span*2);camera.lookAt(target)}renderer.render(scene,camera)}frame();
</script></body></html>
