</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><header><h1>Huellas del Patrimonio</h1><p>Centro de Bogotá · Recorrido 07</p><p id="count">Descubrimientos: 0 / 10</p><p id="status">Cargando escenario…</p><button id="start">Entrar al recorrido</button></header><div id="cross">+</div><div id="hint">WASD · Ratón para mirar · E para explorar</div><div id="pad"><span></span><button data-key="w">↑</button><span></span><button data-key="a">←</button><button data-key="s">↓</button><button data-key="d">→</button></div><button id="explore">Explorar</button><dialog id="book"><h1 id="title"></h1><p>Cuaderno patrimonial</p><p>Ficha provisional. Próximamente: historia, fotografías y diagnóstico de conservación.</p><button id="close">Volver al recorrido</button></dialog><script type="module">
import * as T from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const $=id=>document.getElementById(id),scene=new T.Scene();scene.background=new T.Color(0xcbdfea);scene.fog=new T.Fog(0xcbdfea,180,650);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.prepend(renderer.domElement);const camera=new T.PerspectiveCamera(70,innerWidth/innerHeight,.08,1500);camera.rotation.order='YXZ';scene.add(new T.HemisphereLight(0xffffff,0x998b78,2));const sun=new T.DirectionalLight(0xfff2de,2.2);sun.position.set(-100,180,80);scene.add(sun);let model,sites=[],obstacles=[],bounds,ready=false,nearest,yaw=0,pitch=0,ground=0;const keys=new Set(),seen=new Set(),pos=new T.Vector3();const canvas=renderer.domElement;function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);resize();
function blocked(x,z){return obstacles.some(b=>x>b.min.x-.35&&x<b.max.x+.35&&z>b.min.z-.35&&z<b.max.z+.35)}
function openSite(s){if(!s||$('book').open)return;seen.add(s.id);$('count').textContent='Descubrimientos: '+seen.size+' / '+sites.length;$('title').textContent='Buzón '+s.id;keys.clear();if(document.pointerLockElement)document.exitPointerLock();$('book').showModal()}
$('close').onclick=()=>$('book').close();$('explore').onclick=()=>openSite(nearest);$('start').onclick=()=>canvas.requestPointerLock?.();addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==='e')openSite(nearest);keys.add(e.key.toLowerCase())});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());document.addEventListener('pointerlockchange',()=>keys.clear());document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);keys.add(b.dataset.key)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys.delete(b.dataset.key)});
function look(dx,dy){yaw-=dx*.0025;pitch=T.MathUtils.clamp(pitch-dy*.0025,-1.35,1.35)}document.addEventListener('mousemove',e=>{if(document.pointerLockElement===canvas)look(e.movementX,e.movementY)});let drag=null;canvas.onpointerdown=e=>{if(e.pointerType==='touch'){drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)}};canvas.onpointermove=e=>{if(drag){look(e.clientX-drag[0],e.clientY-drag[1]);drag=[e.clientX,e.clientY]}};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.onclick=()=>{if(document.pointerLockElement===canvas){openSite(nearest)}else if(matchMedia('(pointer:fine)').matches)canvas.requestPointerLock?.()};
new GLTFLoader().load('./bogota.glb',g=>{model=g.scenes.find(s=>s.name==='Scene')||g.scene;scene.add(model);model.updateMatrixWorld(true);const groups=new Map();model.traverse(o=>{const m=o.name.match(/^CTRL_EDIFICIO_(\d+)/i);if(m){const b=new T.Box3().setFromObject(o);if(!b.isEmpty()){groups.set(m[1],b);o.traverse(k=>{k.userData.site=m[1]})}}});sites=[...groups].map(([id,b])=>({id,b,c:b.getCenter(new T.Vector3())}));if(!sites.length){$('status').textContent='No se identificaron edificios';return}bounds=new T.Box3();sites.forEach(s=>bounds.union(s.b));bounds.expandByScalar(80);obstacles=sites.map(s=>s.b.clone().expandByScalar(-0.45));const roadMeshes=[];const flatRoads=[];model.traverse(o=>{if(!o.isMesh)return;const n=o.name; const mats=Array.isArray(o.material)?o.material:[o.material]; if(!o.userData.site && (mats.some(m=>m?.name?.startsWith('MAPA_VIAS_LADRILLO_CORREGIDO')) || /^Via.?way/i.test(n))){o.visible=false;return;} if(/CONTORNO|MARCADOR|ETIQUETA|REFERENCIA|FOTO|ESTILO/i.test(n)&&!o.userData.site){o.visible=false;return}if(/^Contexto|^CONTEXTO/i.test(n)){const b=new T.Box3().setFromObject(o);if(!b.isEmpty()&&b.intersectsBox(bounds)&&b.max.y-b.min.y>2)/* colisiones de contexto desactivadas provisionalmente */ void b;o.material=Array.isArray(o.material)?o.material.map(m=>{const c=m.clone();c.opacity=1;c.transparent=false;c.depthWrite=true;return c}):(()=>{const c=o.material.clone();c.opacity=1;c.transparent=false;c.depthWrite=true;return c})()}if(/CALZADAS|MANZANAS|^Terreno/i.test(n))roadMeshes.push(o);if(!o.userData.site&&mats.some(m=>m?.name?.startsWith('MAPA_CALLES_TERRACOTA_SUAVE'))){roadMeshes.push(o)}});for(const o of flatRoads){const geo=o.geometry.clone();geo.applyMatrix4(o.matrixWorld);const p=geo.attributes.position;for(let i=0;i<p.count;i++)p.setY(i,0.025);p.needsUpdate=true;geo.computeVertexNormals();geo.computeBoundingSphere();const flat=new T.Mesh(geo,new T.MeshStandardMaterial({color:0x777b7c,roughness:1,side:T.DoubleSide}));scene.add(flat);o.visible=false;const idx=roadMeshes.indexOf(o);if(idx>=0)roadMeshes.splice(idx,1);roadMeshes.push(flat)}const floor=new T.Mesh(new T.PlaneGeometry(2000,2000),new T.MeshStandardMaterial({color:0xb8b4aa,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.08;scene.add(floor);const first=sites.find(s=>s.id==='02')||sites[0];const c=first.c;const ray=new T.Raycaster();let spawn=null;for(let r=3;r<65&&!spawn;r+=1){for(let i=0;i<48;i++){const x=c.x+r*Math.cos(i*Math.PI/24),z=c.z+r*Math.sin(i*Math.PI/24);if(blocked(x,z))continue;ray.set(new T.Vector3(x,100,z),new T.Vector3(0,-1,0));const hits=ray.intersectObjects(roadMeshes.filter(o=>o.visible),false);if(hits.length&&hits[0].point.y<5){spawn=new T.Vector3(x,hits[0].point.y,z);break}}}pos.copy(spawn||new T.Vector3(c.x,0,first.b.max.z+3));ground=Math.min(pos.y,.15);yaw=Math.atan2(-(c.x-pos.x),-(c.z-pos.z));buildWalls();ready=true;$('status').textContent=sites.length+' edificios · Escenario original cargado';},undefined,()=>{$('status').textContent='No se pudo cargar bogota.glb'});
const wallGrid=new Map(),cell=12,wallRay=new T.Raycaster(),dir=new T.Vector3(),origin=new T.Vector3();function buildWalls(){model.updateMatrixWorld(true);model.traverse(o=>{if(!o.isMesh||!o.visible)return;for(let p=o.parent;p;p=p.parent)if(!p.visible)return;const b=new T.Box3().setFromObject(o);if(b.isEmpty()||b.max.y<ground+.45||b.min.y>ground+1.65||b.max.y-b.min.y<.18)return;if(!o.userData.site&&!/^contexto/i.test(o.name))return;for(let x=Math.floor(b.min.x/cell);x<=Math.floor(b.max.x/cell);x++)for(let z=Math.floor(b.min.z/cell);z<=Math.floor(b.max.z/cell);z++){const k=x+','+z;if(!wallGrid.has(k))wallGrid.set(k,[]);wallGrid.get(k).push(o)}})}function canStep(dx,dz){const len=Math.hypot(dx,dz);if(len<1e-8)return true;dir.set(dx/len,0,dz/len);const candidates=new Set();for(let x=Math.floor((pos.x-1)/cell);x<=Math.floor((pos.x+1)/cell);x++)for(let z=Math.floor((pos.z-1)/cell);z<=Math.floor((pos.z+1)/cell);z++)for(const o of wallGrid.get(x+','+z)||[])candidates.add(o);wallRay.far=len+.23;for(const h of [.55,1.35])for(const side of [-.18,0,.18]){origin.set(pos.x-dir.z*side,ground+h,pos.z+dir.x*side);wallRay.set(origin,dir);if(wallRay.intersectObjects([...candidates],false).length)return false}return true}const clock=new T.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);if(ready){const x=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft')),z=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));const v=new T.Vector3(x,0,z).applyAxisAngle(new T.Vector3(0,1,0),yaw);if(v.length()&&!$('book').open){v.normalize().multiplyScalar(5*dt);if(canStep(v.x,0))pos.x+=v.x;if(canStep(0,v.z))pos.z+=v.z}camera.position.set(pos.x,ground+1.68,pos.z);camera.rotation.set(pitch,yaw,0,'YXZ');let dist=Infinity;nearest=null;for(const s of sites){const b=s.b,d=Math.hypot(pos.x-T.MathUtils.clamp(pos.x,b.min.x,b.max.x),pos.z-T.MathUtils.clamp(pos.z,b.min.z,b.max.z));if(d<dist&&d<9){dist=d;nearest=s}}$('hint').textContent=nearest?'E · Explorar buzón '+nearest.id:'WASD · Ratón para mirar · Esc para liberar cursor';}if(ready)$('status').textContent='Colisiones de paredes · X '+pos.x.toFixed(1)+' / Z '+pos.z.toFixed(1);renderer.render(scene,camera)}frame();
